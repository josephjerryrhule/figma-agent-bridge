<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Canvas Bridge</title>
  <style>
    :root {
      --bg: #0d0d0e;
      --surface: #141416;
      --surface-hover: #1c1c1f;
      --border: rgba(255, 255, 255, 0.08);
      --border-subtle: rgba(255, 255, 255, 0.04);
      --text: #f4f4f5;
      --text-muted: #71717a;
      --text-dim: #52525b;
      --accent: #ffffff;
      --success: #10b981;
      --danger: #f43f5e;
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, sans-serif;
      --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 11px;
      line-height: 1.4;
      padding: 12px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .brand-mark {
      width: 14px;
      height: 14px;
      border: 1.5px solid #ffffff;
      border-radius: 3px;
      position: relative;
    }

    .brand-mark::after {
      content: '';
      position: absolute;
      width: 4px;
      height: 4px;
      background: #ffffff;
      border-radius: 1px;
      top: 3.5px;
      left: 3.5px;
    }

    .brand-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #ffffff;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-dim);
      transition: all 0.25s ease;
    }

    .status-dot.connected {
      background: var(--success);
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.4);
    }

    /* Agent Monitor Panel */
    .agent-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .agent-tabs {
      display: flex;
      gap: 4px;
    }

    .agent-tab {
      flex: 1;
      padding: 4px 6px;
      background: transparent;
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s;
    }

    .agent-tab .name {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      color: var(--text-dim);
      letter-spacing: 0.02em;
    }

    .agent-tab .count {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-dim);
    }

    .agent-tab.active {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.22);
    }

    .agent-tab.active .name {
      color: #ffffff;
      font-weight: 600;
    }

    .agent-tab.active .count {
      color: var(--text-muted);
    }

    .agent-status-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10.5px;
      color: var(--text-muted);
      padding-top: 4px;
      border-top: 1px solid var(--border-subtle);
    }

    .active-agent-desc {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 250px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 10px;
    }

    .active-agent-desc strong {
      color: #ffffff;
      font-weight: 600;
    }

    .state-indicator {
      font-family: var(--font-mono);
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    .state-indicator.live {
      color: var(--success);
    }

    /* Activity Feed */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 6px;
      padding: 0 2px;
    }

    .activity-stream {
      flex: 1;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 10px;
    }

    .log-row {
      padding: 5px 7px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .log-row:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: var(--border-subtle);
    }

    .log-row.error {
      border-left: 2px solid var(--danger);
    }

    .log-row-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 9.5px;
    }

    .log-row-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .agent-tag {
      color: #ffffff;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .cmd-name {
      color: var(--text-muted);
    }

    .time-stamp {
      color: var(--text-dim);
    }

    .log-row-content {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .log-row-content.success {
      color: #d4d4d8;
    }

    .log-row-content.error {
      color: var(--danger);
    }

    /* Actions Bottom Toolbar */
    .toolbar {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .btn {
      flex: 1;
      height: 28px;
      padding: 0 10px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: var(--surface-hover);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.18);
    }

    .btn.primary {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
      font-weight: 600;
    }

    .btn.primary:hover {
      background: #e4e4e7;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-title">Agent Bridge</div>
    </div>
    <div class="status-pill" id="statusBadge">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">3055 · Disconnected</span>
    </div>
  </div>

  <!-- Agent Monitor Strip -->
  <div class="agent-panel">
    <div class="agent-tabs">
      <div class="agent-tab" id="tab-AGY">
        <span class="name">AGY</span>
        <span class="count" id="count-AGY">0</span>
      </div>
      <div class="agent-tab" id="tab-Claude">
        <span class="name">Claude</span>
        <span class="count" id="count-Claude">0</span>
      </div>
      <div class="agent-tab" id="tab-Codex">
        <span class="name">Codex</span>
        <span class="count" id="count-Codex">0</span>
      </div>
      <div class="agent-tab" id="tab-ChatGPT">
        <span class="name">ChatGPT</span>
        <span class="count" id="count-ChatGPT">0</span>
      </div>
    </div>
    <div class="agent-status-line">
      <span class="active-agent-desc" id="statusDesc">Standby · Waiting for agent</span>
      <span class="state-indicator" id="statePill">IDLE</span>
    </div>
  </div>

  <div class="section-header">
    <span>Activity</span>
    <span id="logCount">0 events</span>
  </div>

  <div class="activity-stream" id="logsContainer">
    <div class="empty-state" id="emptyLogs">No recent activity</div>
  </div>

  <div class="toolbar">
    <button class="btn" id="btnPing">Ping</button>
    <button class="btn" id="btnClear">Clear</button>
    <button class="btn primary" id="btnReconnect">Reconnect</button>
  </div>

  <script>
    const WS_URL = 'ws://127.0.0.1:3055';
    let socket = null;
    let reconnectTimeout = null;
    let pluginInfo = null;
    let bridgeStarted = false;
    let commandCount = 0;
    let idleTimer = null;

    const agentCounters = {
      'AGY': 0,
      'Claude': 0,
      'Codex': 0,
      'ChatGPT': 0
    };

    let activeAgentCategory = null;

    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const logsContainer = document.getElementById('logsContainer');
    const emptyLogs = document.getElementById('emptyLogs');
    const logCount = document.getElementById('logCount');

    const statusDesc = document.getElementById('statusDesc');
    const statePill = document.getElementById('statePill');

    function classifyAgent(name) {
      if (!name) return { category: 'Codex', label: 'Codex' };
      const lower = name.toLowerCase();
      if (lower.includes('agy') || lower.includes('antigravity')) {
        return { category: 'AGY', label: 'AGY' };
      }
      if (lower.includes('claude')) {
        return { category: 'Claude', label: 'Claude' };
      }
      if (lower.includes('codex') || lower.includes('cursor')) {
        return { category: 'Codex', label: 'Codex' };
      }
      if (lower.includes('chatgpt') || lower.includes('gpt') || lower.includes('openai')) {
        return { category: 'ChatGPT', label: 'ChatGPT' };
      }
      return { category: 'Codex', label: name };
    }

    function setActiveAgent(agentName, command, isExecuting) {
      const { category, label } = classifyAgent(agentName);
      activeAgentCategory = category;

      if (isExecuting && agentCounters[category] !== undefined) {
        agentCounters[category]++;
        const countEl = document.getElementById(`count-${category}`);
        if (countEl) countEl.textContent = String(agentCounters[category]);
      }

      ['AGY', 'Claude', 'Codex', 'ChatGPT'].forEach(cat => {
        const tab = document.getElementById(`tab-${cat}`);
        if (tab) {
          if (cat === category) {
            tab.classList.add('active');
          } else {
            tab.classList.remove('active');
          }
        }
      });

      if (isExecuting) {
        statusDesc.innerHTML = `<strong>${label}</strong> · ${command || 'executing'}`;
        statePill.className = 'state-indicator live';
        statePill.textContent = 'ACTIVE';
      } else {
        statusDesc.innerHTML = `<strong>${label}</strong> · completed`;
        statePill.className = 'state-indicator live';
        statePill.textContent = 'ACTIVE';
      }

      if (idleTimer) clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        statePill.className = 'state-indicator';
        statePill.textContent = 'IDLE';
        statusDesc.innerHTML = `Standby · Last active: ${label}`;
        
        ['AGY', 'Claude', 'Codex', 'ChatGPT'].forEach(cat => {
          const tab = document.getElementById(`tab-${cat}`);
          if (tab) tab.classList.remove('active');
        });
      }, 10000);
    }

    function updateStatus(connected, text) {
      if (connected) {
        statusDot.className = 'status-dot connected';
        statusText.textContent = text || '3055 · Live';
      } else {
        statusDot.className = 'status-dot';
        statusText.textContent = text || '3055 · Offline';
      }
    }

    function addLog(agentName, command, detail, isError = false, timeMs = null) {
      if (emptyLogs) emptyLogs.style.display = 'none';

      commandCount++;
      logCount.textContent = `${commandCount} events`;

      const { label } = classifyAgent(agentName);
      const row = document.createElement('div');
      row.className = 'log-row' + (isError ? ' error' : '');

      const now = new Date().toTimeString().split(' ')[0];
      const timeTag = timeMs !== null && timeMs !== undefined ? ` · ${timeMs}ms` : '';

      row.innerHTML = `
        <div class="log-row-meta">
          <div class="log-row-left">
            <span class="agent-tag">${label}</span>
            <span class="cmd-name">${command}</span>
          </div>
          <span class="time-stamp">${now}${timeTag}</span>
        </div>
        <div class="log-row-content ${isError ? 'error' : 'success'}">${detail}</div>
      `;

      logsContainer.appendChild(row);
      logsContainer.scrollTop = logsContainer.scrollHeight;
    }

    function connectWebSocket() {
      if (socket) {
        try { socket.close(); } catch (_) {}
      }

      updateStatus(false, 'Connecting...');

      try {
        socket = new WebSocket(WS_URL);

        socket.onopen = () => {
          updateStatus(true, '3055 · Live');
          addLog('System', 'BRIDGE', 'Connected to local relay');
          
          socket.send(JSON.stringify({
            ...pluginInfo,
            type: 'PLUGIN_CONNECTED',
            timestamp: Date.now()
          }));
        };

        socket.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            const agent = data.agent || 'AI Agent';
            const cmd = data.command || 'COMMAND';

            setActiveAgent(agent, cmd, true);

            let preview = '';
            if (data.payload && typeof data.payload === 'object') {
              const keys = Object.keys(data.payload);
              if (keys.length > 0) {
                preview = JSON.stringify(data.payload).slice(0, 80);
              }
            }
            addLog(agent, cmd, preview || 'Dispatched command');

            parent.postMessage({ pluginMessage: data }, '*');
          } catch (e) {
            addLog('System', 'ERROR', e.message, true);
          }
        };

        socket.onclose = () => {
          updateStatus(false, '3055 · Offline');
          scheduleReconnect();
        };

        socket.onerror = () => {
          updateStatus(false, '3055 · Error');
        };
      } catch (err) {
        updateStatus(false, '3055 · Offline');
        scheduleReconnect();
      }
    }

    function scheduleReconnect() {
      if (reconnectTimeout) clearTimeout(reconnectTimeout);
      reconnectTimeout = setTimeout(() => {
        connectWebSocket();
      }, 3000);
    }

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'PLUGIN_INFO') {
        pluginInfo = msg;
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ type: 'PLUGIN_INFO', ...pluginInfo }));
        } else if (!bridgeStarted) {
          bridgeStarted = true;
          connectWebSocket();
        }
        return;
      }

      const agent = msg.agent || activeAgentCategory || 'Agent';
      const cmd = msg.command || 'DONE';

      setActiveAgent(agent, cmd, false);

      if (msg.success) {
        const detail = msg.data?.name || msg.data?.id || (typeof msg.data === 'object' ? 'Completed' : String(msg.data));
        addLog(agent, `${cmd} ✓`, detail, false, msg.executionTimeMs);
      } else {
        addLog(agent, `${cmd} ✕`, msg.error || 'Execution failed', true, msg.executionTimeMs);
      }

      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify(msg));
      }
    };

    document.getElementById('btnPing').onclick = () => {
      setActiveAgent('Local', 'GET_STATUS', true);
      parent.postMessage({
        pluginMessage: {
          id: 'ping-' + Date.now(),
          command: 'GET_STATUS',
          agent: 'Local',
          payload: {}
        }
      }, '*');
    };

    document.getElementById('btnClear').onclick = () => {
      logsContainer.innerHTML = '<div class="empty-state" id="emptyLogs">No recent activity</div>';
      commandCount = 0;
      logCount.textContent = '0 events';
    };

    document.getElementById('btnReconnect').onclick = () => {
      connectWebSocket();
    };

    parent.postMessage({ pluginMessage: { type: 'UI_READY' } }, '*');
  </script>
</body>
</html>
